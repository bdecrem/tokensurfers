name: TokenSurfers
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TokenSurfers:
    type: application
    platform: iOS
    sources:
      - path: TokenSurfers
    info:
      path: TokenSurfers/Info.plist
      properties:
        CFBundleDisplayName: Token Surfers
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Anton-Regular.ttf
          - Montserrat-Black.ttf
          - Montserrat-ExtraBold.ttf
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Hold the mic to tell Splat what to build or change, even while he's working.
        NSSpeechRecognitionUsageDescription: Your voice notes to Splat are turned into text so he can read them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bartdecrem.tokensurfers.remix
            CFBundleURLSchemes:
              - tokensurfers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.tokensurfers
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
