    <!-- splat hair -->
    <use xlink:href="#raysB" stroke="#1D1530" stroke-width="29"/>
    <use xlink:href="#raysB" stroke="url(#hairGradB)" stroke-width="20"/>

    <!-- spring antenna + token -->
    <use xlink:href="#antennaB" stroke="#1D1530" stroke-width="6" fill="none"/>
    <circle cx="226" cy="82" r="17" fill="#F5C542" stroke="#1D1530" stroke-width="4.5"/>
    <circle cx="226" cy="82" r="11" fill="none" stroke="#DDA127" stroke-width="3"/>
    <path d="M226 74 L232 82 L226 90 L220 82 Z" fill="#E8703A"/>

    <!-- arms -->
    <use xlink:href="#armLB" stroke="#1D1530" stroke-width="40" fill="none"/>
    <use xlink:href="#armLB" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armLB" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-5 -3)" opacity="0.75"/>
    <use xlink:href="#armRB" stroke="#1D1530" stroke-width="40" fill="none"/>
    <use xlink:href="#armRB" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armRB" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-4 -5)" opacity="0.75"/>

    <!-- hands -->
    <circle cx="104" cy="146" r="19" fill="#E0602A" stroke="#1D1530" stroke-width="5"/>
    <circle cx="98" cy="140" r="5" fill="#FFB98A" opacity="0.8"/>
    <circle cx="336" cy="198" r="19" fill="#E0602A" stroke="#1D1530" stroke-width="5"/>
    <circle cx="330" cy="192" r="5" fill="#FFB98A" opacity="0.8"/>

    <!-- sneakers, heel view -->
    <g transform="translate(0 10)">
      <use xlink:href="#heelL" fill="#FFFFFF" stroke="#1D1530" stroke-width="5"/>
      <use xlink:href="#heelR" fill="#FFFFFF" stroke="#1D1530" stroke-width="5"/>
      <rect x="184" y="492" width="10" height="16" rx="4" fill="#E8703A" stroke="#1D1530" stroke-width="3"/>
      <rect x="234" y="492" width="10" height="16" rx="4" fill="#E8703A" stroke="#1D1530" stroke-width="3"/>
      <rect x="164" y="508" width="50" height="14" rx="7" fill="#1D1530"/>
      <rect x="214" y="508" width="50" height="14" rx="7" fill="#1D1530"/>
    </g>

    <!-- tube body -->
    <use xlink:href="#bodyB" fill="url(#bodyGradB)"/>
    <g clip-path="url(#bodyClipB)" fill="none">
      <path d="M226 200 Q216 350 214 490" stroke="#C4461A" stroke-width="3" opacity="0.6"/>
      <path d="M150 405 Q212 420 272 402" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M150 448 Q212 463 272 445" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFC29A" stroke-width="10" opacity="0.7"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFF1E4" stroke-width="3" opacity="0.8"/>
      <!-- shades strap -->
      <path d="M160 256 Q222 268 280 248" stroke="#1D1530" stroke-width="11"/>
    </g>
    <use xlink:href="#bodyB" fill="none" stroke="#1D1530" stroke-width="7"/>

    <!-- strap ends poking past the head + adjuster -->
    <path d="M165 255 L178 257" stroke="#1D1530" stroke-width="9"/>
    <path d="M267 251 L281 247" stroke="#1D1530" stroke-width="9"/>
    <rect x="213" y="253" width="20" height="13" rx="4" fill="#7B45D6" stroke="#1D1530" stroke-width="3"/>

    <!-- terminal patch on the back -->
    <rect x="195" y="318" width="48" height="34" rx="9" fill="#1D1530" stroke="#3A3060" stroke-width="3"/>
    <path d="M205 328 L214 335 L205 342" fill="none" stroke="#7CF29A" stroke-width="4"/>
    <path d="M219 343 L231 343" stroke="#7CF29A" stroke-width="4"/>
  </g>
</svg>
