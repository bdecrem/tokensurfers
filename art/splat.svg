<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="30 40 380 520" width="380" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="0.5" stop-color="#F4733B"/>
      <stop offset="1" stop-color="#D5521F"/>
    </linearGradient>
    <linearGradient id="hairGrad" gradientUnits="userSpaceOnUse" x1="0" y1="215" x2="0" y2="115">
      <stop offset="0" stop-color="#E5552A"/>
      <stop offset="0.55" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A45"/>
      <stop offset="0.55" stop-color="#7B45D6"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>

    <path id="body" d="M162 488 C150 400 180 330 176 270 C174 225 196 198 226 198 C256 198 272 225 268 270 C266 330 256 400 266 488 Q214 502 162 488 Z"/>
    <path id="armL" d="M190 305 C148 312 128 275 118 245 S94 190 104 152"/>
    <path id="armR" d="M256 300 C296 310 306 282 316 258 S330 222 336 204"/>
    <path id="antenna" d="M226 200 Q214 170 230 146 T226 98"/>
    <path id="thumb" d="M336 198 L313 173"/>
    <path id="pinky" d="M336 198 L363 183"/>
    <path id="shoeL" d="M214 512 L214 482 Q213 472 202 472 L176 472 Q168 473 166 482 Q164 492 150 497 Q142 502 144 512 Z"/>
    <path id="shoeR" d="M208 512 L208 482 Q209 472 220 472 L246 472 Q254 473 256 482 Q258 492 272 497 Q280 502 278 512 Z"/>
    <g id="rays">
      <line x1="226" y1="212" x2="181" y2="202"/>
      <line x1="226" y1="212" x2="175" y2="176"/>
      <line x1="226" y1="212" x2="185" y2="146"/>
      <line x1="226" y1="212" x2="208" y2="128"/>
      <line x1="226" y1="212" x2="244" y2="128"/>
      <line x1="226" y1="212" x2="267" y2="146"/>
      <line x1="226" y1="212" x2="277" y2="176"/>
      <line x1="226" y1="212" x2="271" y2="202"/>
    </g>
    <clipPath id="bodyClip"><use xlink:href="#body"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="213" cy="538" rx="104" ry="12" fill="#1D1530" opacity="0.22"/>

  <g transform="rotate(-3 211 500)" stroke-linecap="round" stroke-linejoin="round">

    <!-- sticker outline -->
    <g stroke="#FFFFFF" fill="#FFFFFF">
      <use xlink:href="#rays" stroke-width="40"/>
      <use xlink:href="#antenna" stroke-width="16" fill="none"/>
      <circle cx="226" cy="82" r="25"/>
      <use xlink:href="#armL" stroke-width="52" fill="none"/>
      <use xlink:href="#armR" stroke-width="52" fill="none"/>
      <circle cx="104" cy="146" r="27"/>
      <use xlink:href="#thumb" stroke-width="26"/>
      <use xlink:href="#pinky" stroke-width="26"/>
      <circle cx="336" cy="198" r="26"/>
      <use xlink:href="#shoeL" stroke-width="16" transform="translate(0 10)"/>
      <use xlink:href="#shoeR" stroke-width="16" transform="translate(0 10)"/>
      <rect x="140" y="508" width="80" height="14" rx="7" stroke-width="16" transform="translate(0 10)"/>
      <rect x="202" y="508" width="80" height="14" rx="7" stroke-width="16" transform="translate(0 10)"/>
      <use xlink:href="#body" stroke-width="20"/>
    </g>

    <!-- splat hair -->
    <use xlink:href="#rays" stroke="#1D1530" stroke-width="29"/>
    <use xlink:href="#rays" stroke="url(#hairGrad)" stroke-width="20"/>

    <!-- spring antenna + token -->
    <use xlink:href="#antenna" stroke="#1D1530" stroke-width="6" fill="none"/>
    <circle cx="226" cy="82" r="17" fill="#F5C542" stroke="#1D1530" stroke-width="4.5"/>
    <circle cx="226" cy="82" r="11" fill="none" stroke="#DDA127" stroke-width="3"/>
    <path d="M226 74 L232 82 L226 90 L220 82 Z" fill="#E8703A"/>

    <!-- arms -->
    <use xlink:href="#armL" stroke="#1D1530" stroke-width="40" fill="none"/>
    <use xlink:href="#armL" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armL" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-5 -3)" opacity="0.75"/>
    <use xlink:href="#armR" stroke="#1D1530" stroke-width="40" fill="none"/>
    <use xlink:href="#armR" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armR" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-4 -5)" opacity="0.75"/>

    <!-- left hand -->
    <circle cx="104" cy="146" r="19" fill="#E0602A" stroke="#1D1530" stroke-width="5"/>
    <circle cx="98" cy="140" r="5" fill="#FFB98A" opacity="0.8"/>

    <!-- right hand: shaka -->
    <use xlink:href="#thumb" stroke="#1D1530" stroke-width="18"/>
    <use xlink:href="#thumb" stroke="#E0602A" stroke-width="10"/>
    <use xlink:href="#pinky" stroke="#1D1530" stroke-width="18"/>
    <use xlink:href="#pinky" stroke="#E0602A" stroke-width="10"/>
    <circle cx="336" cy="198" r="18" fill="#E0602A" stroke="#1D1530" stroke-width="5"/>
    <path d="M328 196 Q336 191 344 196 M329 204 Q336 199 343 204" fill="none" stroke="#1D1530" stroke-width="3"/>

    <!-- sneakers -->
    <use xlink:href="#shoeL" fill="#FFFFFF" stroke="#1D1530" stroke-width="5" transform="translate(0 10)"/>
    <use xlink:href="#shoeR" fill="#FFFFFF" stroke="#1D1530" stroke-width="5" transform="translate(0 10)"/>
    <path d="M170 498 L186 490 L184 497 L198 492" fill="none" stroke="#E8703A" stroke-width="4" transform="translate(0 10)"/>
    <path d="M252 498 L236 490 L238 497 L224 492" fill="none" stroke="#E8703A" stroke-width="4" transform="translate(0 10)"/>
    <rect x="140" y="508" width="80" height="14" rx="7" fill="#1D1530" transform="translate(0 10)"/>
    <rect x="202" y="508" width="80" height="14" rx="7" fill="#1D1530" transform="translate(0 10)"/>

    <!-- tube body -->
    <use xlink:href="#body" fill="url(#bodyGrad)"/>
    <g clip-path="url(#bodyClip)" fill="none">
      <path d="M150 405 Q212 420 272 402" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M150 448 Q212 463 272 445" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFC29A" stroke-width="10" opacity="0.7"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFF1E4" stroke-width="3" opacity="0.8"/>
    </g>
    <use xlink:href="#body" fill="none" stroke="#1D1530" stroke-width="7"/>

    <g transform="translate(6 0)">
    <!-- chest terminal -->
    <rect x="191" y="338" width="48" height="34" rx="9" fill="#1D1530" stroke="#3A3060" stroke-width="3"/>
    <path d="M201 348 L210 355 L201 362" fill="none" stroke="#7CF29A" stroke-width="4"/>
    <path d="M215 363 L227 363" stroke="#7CF29A" stroke-width="4"/>

    <!-- blush -->
    <ellipse cx="182" cy="293" rx="10" ry="5.5" fill="#FF6F87" opacity="0.5"/>
    <ellipse cx="250" cy="283" rx="7" ry="4.5" fill="#FF6F87" opacity="0.5"/>

    <!-- grin -->
    <path d="M192 300 Q222 328 250 292 Q222 308 192 300 Z" fill="#2A1216" stroke="#1D1530" stroke-width="4"/>
    <path d="M198 302 Q222 309 244 297 Q240 303 234 306 Q218 311 201 305 Z" fill="#FFFFFF"/>
    <path d="M250 292 Q256 290 257 284" fill="none" stroke="#1D1530" stroke-width="3"/>

    <!-- shades -->
    <path d="M166 250 Q214 238 264 238 L262 252 Q258 276 236 278 Q220 278 216 262 Q213 258 210 262 Q204 282 186 282 Q170 280 168 262 Z"
          fill="url(#lensGrad)" stroke="#1D1530" stroke-width="5"/>
    <path d="M166 250 Q214 238 264 238" fill="none" stroke="#1D1530" stroke-width="8"/>
    <path d="M184 253 L192 251 L182 274 L176 272 Z" fill="#FFFFFF" opacity="0.85" stroke="none"/>
    <path d="M232 247 L238 246 L229 268 L224 267 Z" fill="#FFFFFF" opacity="0.85" stroke="none"/>
    </g>
  </g>
</svg>
