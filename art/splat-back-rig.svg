<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="30 40 380 520" width="380" height="520" id="splat-back" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    RIG: every animatable part is defined ONCE in <defs> and carries
      data-rig="<name>"  data-pivot="x y"  transform="rotate(0 x y)"
    All layers (sticker edge, dark outline, fill, highlight) are <use> copies,
    so rotating the defs element moves every layer together.
    Rigs: armL, armR, antenna, ray1..ray8 (left to right)
  -->
  <defs>
    <linearGradient id="bodyGradB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="0.5" stop-color="#F4733B"/>
      <stop offset="1" stop-color="#D5521F"/>
    </linearGradient>
    <linearGradient id="hairGradB" gradientUnits="userSpaceOnUse" x1="0" y1="215" x2="0" y2="115">
      <stop offset="0" stop-color="#E5552A"/>
      <stop offset="0.55" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>

    <path id="bodyB" d="M162 488 C150 400 180 330 176 270 C174 225 196 198 226 198 C256 198 272 225 268 270 C266 330 256 400 266 488 Q214 502 162 488 Z"/>
    <path id="heelL" d="M168 512 L168 486 Q168 476 179 476 L199 476 Q210 476 210 486 L210 512 Z"/>
    <path id="heelR" d="M218 512 L218 486 Q218 476 229 476 L249 476 Q260 476 260 486 L260 512 Z"/>

    <!-- left arm rig (pivot = shoulder) -->
    <path id="armLB"   data-rig="armL" data-pivot="190 305" transform="rotate(0 190 305)" d="M190 305 C148 312 128 275 118 245 S94 190 104 152"/>
    <path id="handL"   data-rig="armL" data-pivot="190 305" transform="rotate(0 190 305)" d="M104 146 h0.01"/>
    <path id="handLHi" data-rig="armL" data-pivot="190 305" transform="rotate(0 190 305)" d="M98 140 h0.01"/>

    <!-- right arm rig -->
    <path id="armRB"   data-rig="armR" data-pivot="256 300" transform="rotate(0 256 300)" d="M256 300 C296 310 306 282 316 258 S330 222 336 204"/>
    <path id="handR"   data-rig="armR" data-pivot="256 300" transform="rotate(0 256 300)" d="M336 198 h0.01"/>
    <path id="handRHi" data-rig="armR" data-pivot="256 300" transform="rotate(0 256 300)" d="M330 192 h0.01"/>

    <!-- antenna rig (spring + coin) -->
    <path id="antennaB" data-rig="antenna" data-pivot="226 200" transform="rotate(0 226 200)" d="M226 200 Q214 170 230 146 T226 98"/>
    <circle id="coinEdge" data-rig="antenna" data-pivot="226 200" transform="rotate(0 226 200)" cx="226" cy="82" r="25"/>
    <g id="coinB" data-rig="antenna" data-pivot="226 200" transform="rotate(0 226 200)">
      <circle cx="226" cy="82" r="17" fill="#F5C542" stroke="#1D1530" stroke-width="4.5"/>
      <circle cx="226" cy="82" r="11" fill="none" stroke="#DDA127" stroke-width="3"/>
      <path d="M226 74 L232 82 L226 90 L220 82 Z" fill="#E8703A" stroke="none"/>
    </g>

    <!-- hair rays, each its own rig -->
    <g id="raysB">
      <line id="ray1" data-rig="ray1" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="181" y2="202"/>
      <line id="ray2" data-rig="ray2" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="175" y2="176"/>
      <line id="ray3" data-rig="ray3" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="185" y2="146"/>
      <line id="ray4" data-rig="ray4" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="208" y2="128"/>
      <line id="ray5" data-rig="ray5" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="244" y2="128"/>
      <line id="ray6" data-rig="ray6" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="267" y2="146"/>
      <line id="ray7" data-rig="ray7" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="277" y2="176"/>
      <line id="ray8" data-rig="ray8" data-pivot="226 212" transform="rotate(0 226 212)" x1="226" y1="212" x2="271" y2="202"/>
    </g>

    <clipPath id="bodyClipB"><use xlink:href="#bodyB"/></clipPath>
  </defs>

  <ellipse cx="213" cy="538" rx="104" ry="12" fill="#1D1530" opacity="0.22"/>

  <g transform="rotate(-3 211 500)" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. white sticker edge -->
    <g stroke="#FFFFFF" fill="#FFFFFF">
      <use xlink:href="#raysB" stroke-width="40"/>
      <use xlink:href="#antennaB" stroke-width="16" fill="none"/>
      <use xlink:href="#coinEdge" stroke="none"/>
      <use xlink:href="#armLB" stroke-width="52" fill="none"/>
      <use xlink:href="#armRB" stroke-width="52" fill="none"/>
      <use xlink:href="#handL" stroke-width="54"/>
      <use xlink:href="#handR" stroke-width="54"/>
      <g transform="translate(0 10)">
        <use xlink:href="#heelL" stroke-width="16"/>
        <use xlink:href="#heelR" stroke-width="16"/>
        <rect x="164" y="508" width="50" height="14" rx="7" stroke-width="16"/>
        <rect x="214" y="508" width="50" height="14" rx="7" stroke-width="16"/>
      </g>
      <use xlink:href="#bodyB" stroke-width="20"/>
    </g>

    <!-- 2. merged dark silhouette (outer outline only) -->
    <g stroke="#1D1530" fill="#1D1530">
      <use xlink:href="#raysB" stroke-width="29"/>
      <use xlink:href="#armLB" stroke-width="40" fill="none"/>
      <use xlink:href="#armRB" stroke-width="40" fill="none"/>
      <use xlink:href="#handL" stroke-width="43"/>
      <use xlink:href="#handR" stroke-width="43"/>
      <use xlink:href="#bodyB" stroke-width="7"/>
    </g>

    <!-- 3. antenna + coin -->
    <use xlink:href="#antennaB" stroke="#1D1530" stroke-width="6" fill="none"/>
    <use xlink:href="#coinB"/>

    <!-- 4. fills, no internal lines -->
    <use xlink:href="#raysB" stroke="url(#hairGradB)" stroke-width="20"/>
    <use xlink:href="#armLB" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armRB" stroke="#F57A3F" stroke-width="30" fill="none"/>
    <use xlink:href="#armLB" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-5 -3)" opacity="0.75"/>
    <use xlink:href="#armRB" stroke="#FFB98A" stroke-width="7" fill="none" transform="translate(-4 -5)" opacity="0.75"/>
    <use xlink:href="#handL" stroke="#E0602A" stroke-width="38"/>
    <use xlink:href="#handR" stroke="#E0602A" stroke-width="38"/>
    <use xlink:href="#handLHi" stroke="#FFB98A" stroke-width="10" opacity="0.8"/>
    <use xlink:href="#handRHi" stroke="#FFB98A" stroke-width="10" opacity="0.8"/>

    <!-- 5. sneakers -->
    <g transform="translate(0 10)">
      <use xlink:href="#heelL" fill="#FFFFFF" stroke="#1D1530" stroke-width="5"/>
      <use xlink:href="#heelR" fill="#FFFFFF" stroke="#1D1530" stroke-width="5"/>
      <rect x="184" y="492" width="10" height="16" rx="4" fill="#E8703A" stroke="#1D1530" stroke-width="3"/>
      <rect x="234" y="492" width="10" height="16" rx="4" fill="#E8703A" stroke="#1D1530" stroke-width="3"/>
      <rect x="164" y="508" width="50" height="14" rx="7" fill="#1D1530"/>
      <rect x="214" y="508" width="50" height="14" rx="7" fill="#1D1530"/>
    </g>

    <!-- 6. tube body -->
    <use xlink:href="#bodyB" fill="url(#bodyGradB)"/>
    <g clip-path="url(#bodyClipB)" fill="none">
      <path d="M226 200 Q216 350 214 490" stroke="#C4461A" stroke-width="3" opacity="0.6"/>
      <path d="M150 405 Q212 420 272 402" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M150 448 Q212 463 272 445" stroke="#C4461A" stroke-width="3" opacity="0.55"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFC29A" stroke-width="10" opacity="0.7"/>
      <path d="M196 226 Q180 330 176 470" stroke="#FFF1E4" stroke-width="3" opacity="0.8"/>
      <path d="M160 256 Q222 268 280 248" stroke="#1D1530" stroke-width="11"/>
    </g>
    <path d="M162 488 Q214 502 266 488" fill="none" stroke="#1D1530" stroke-width="7"/>

    <path d="M165 255 L178 257" stroke="#1D1530" stroke-width="9"/>
    <path d="M267 251 L281 247" stroke="#1D1530" stroke-width="9"/>
    <rect x="213" y="253" width="20" height="13" rx="4" fill="#7B45D6" stroke="#1D1530" stroke-width="3"/>

    <rect x="195" y="318" width="48" height="34" rx="9" fill="#1D1530" stroke="#3A3060" stroke-width="3"/>
    <path d="M205 328 L214 335 L205 342" fill="none" stroke="#7CF29A" stroke-width="4"/>
    <path d="M219 343 L231 343" stroke="#7CF29A" stroke-width="4"/>
  </g>
</svg>
